mc('الاحتفاظ بنظام التشغيل وبرامج التطبيقات محدثة يمنع ...... الأمنية.',['الهجمات','النسخ','الاختراق','جميع ما ذكر'],3),

const T={en:{d:'ltr',t:'Lesson 2: Threats and Countermeasures in Information Security (2)',n:'Enter your name',go:'Start',nx:'Next ▶',q:'Quick Quiz',ex:'Take the Exam (English)',sc:'Your score',send:'📲 Send result to WhatsApp',ok:'Correct! 🎉',no:'Wrong ❌',end:'Lesson finished! 🌟',
S:[[`<h2>1) Passwords</h2><h3>Password</h3><p>A string of characters used to verify that the person using a given ID is the owner of the account.</p><h3>Guidelines for Creating Passwords</h3><p>① Use a string that is as long as possible.<br>② Combine: uppercase letters, lowercase letters, numbers, symbols.<br>③ <u>Do not</u> use personal information such as your birthday, email address, or user ID.<br>④ <u>Do not</u> reuse passwords used for other services.</p><h3>One-time password</h3><p>A password that changes at regular intervals and can only be used <u>once</u>.</p>`,[0,1,16,17,31]],
[`<h2>2) Authentication</h2><p>The process of <b>verifying the identity</b> of a user on a computer or network.</p><h3>Types</h3><table><tr><th>Name</th><th>Method</th><th>Example</th></tr><tr><td>Knowledge-based</td><td>Information known only to the individual</td><td>User ID, Password, PIN code</td></tr><tr><td>Biometric</td><td>Physical or behavioural characteristics</td><td>Fingerprint, Iris, Vein pattern, Handwriting</td></tr><tr><td>Possession-based</td><td>An item the individual possesses</td><td>IC card, One-time password, SMS verification</td></tr></table><h3>Additional types</h3><table><tr><td><b>Two-factor</b></td><td>Combines two <b>different types</b> of factors</td><td>Password + Fingerprint</td></tr><tr><td><b>Two-step</b></td><td>Two steps using two pieces of information from the <b>same type</b></td><td>Password + one-time code</td></tr></table>`,[2,3,4,5,6]],
[`<h2>3) Information Security Measures</h2><h3>Access Control</h3><p>Allows only authorized (verified) users to access computer systems or data.</p><h3>Firewall</h3><p>A system installed at network entry points to: ① prevent unauthorized access from outside, ② stop data leaks from within.</p><h3>Countermeasures Against Viruses</h3><p>① Install antivirus software and keep it up to date.<br>② Keep the operating system and applications updated to prevent security holes (vulnerabilities).<br>③ Regularly create backups of your data.</p>`,[7,8,9,11,12]]]},
ar:{d:'rtl',t:'الدرس (٢): التهديدات والتدابير المضادة في أمن المعلومات ②',n:'اكتب اسمك',go:'ابدأ',nx:'التالي ◀',q:'اختبر نفسك',ex:'ابدأ الاختبار (بالعربي)',sc:'درجتك',send:'📲 أرسل النتيجة على الواتساب',ok:'إجابة صحيحة! 🎉',no:'إجابة خاطئة ❌',end:'أنهيت الدرس! 🌟',
S:[[`<h2>١) كلمات المرور</h2><h3>كلمة المرور (Password)</h3><p>سلسلة من الأحرف تستخدم للتأكد من هوية المستخدم وأنه صاحب الحساب الشرعي.</p><h3>إرشادات إنشاء كلمات المرور</h3><p>① استخدم سلسلة أحرف (طويلة) قدر الإمكان.<br>② اجمع بين الأحرف الكبيرة والصغيرة والأرقام والرموز.<br>③ لا تستخدم معلومات شخصية مثل تاريخ ميلادك أو بريدك الإلكتروني أو معرف المستخدم أو رقم الهاتف.<br>④ لا تعد استخدام كلمات المرور المستخدمة في خدمات أخرى.</p><h3>كلمة المرور لمرة واحدة (OTP)</h3><p>يتم استخدامها مرة واحدة فقط وتتغير باستمرار لزيادة الأمان. مثال: عند استعادة كلمة المرور يصل رمز مؤقت عبر SMS ثم يصبح غير صالح.</p>`,[1,14,15,39,19]],
[`<h2>٢) المصادقة (Authentication)</h2><p>عملية التأكد والتحقق من أن الشخص الذي يحاول الوصول إلى الجهاز أو الحساب أو الشبكة هو مستخدم حقيقي ومصرح له.</p><h3>أنواع المصادقة</h3><table><tr><th>الاسم</th><th>الطريقة</th><th>أمثلة</th></tr><tr><td>القائمة على المعرفة</td><td>معلومات يعرفها المستخدم فقط</td><td>معرف المستخدم، كلمة المرور، PIN</td></tr><tr><td>البيومترية</td><td>الخصائص الفيزيائية أو السلوكية للفرد</td><td>بصمة الإصبع، القزحية، نمط الوريد، خط اليد</td></tr><tr><td>القائمة على الحيازة</td><td>عنصر يمتلكه المستخدم</td><td>البطاقة الذكية، OTP، رمز SMS</td></tr><tr><td>الثنائية (عاملين مختلفين)</td><td>عاملان مختلفان معًا (معرفة + حيازة)</td><td>رقم PIN ثم رمز SMS</td></tr><tr><td>متعددة الخطوات</td><td>خطوتان بمعلومتين من نفس نوع العامل</td><td>كلمة المرور + سؤال سري</td></tr></table>`,[2,3,4,5,6]],
[`<h2>٣) إجراءات أمن المعلومات</h2><h3>التحكم في الوصول</h3><p>يُسمح فقط للأشخاص المصرح لهم بالدخول من خلال المصادقة. الهدف: حماية البيانات ومنع الاستخدام غير المصرح به.</p><h3>جدار الحماية (Firewall)</h3><p>نظام أمني عند نقاط اتصال الشبكة بالإنترنت لمراقبة البيانات الداخلة والخارجة: منع المتسللين والفيروسات، وحماية البيانات من التسرب.</p><h3>إجراءات مواجهة الفيروسات</h3><p>① تثبيت برنامج مكافحة الفيروسات.<br>② تحديث تعريفات الفيروسات باستمرار.<br>③ تحديث نظام التشغيل والتطبيقات لإصلاح الثغرات الأمنية.<br>④ إنشاء نسخ احتياطية بانتظام.</p>`,[8,9,10,11,12]]]}};
const pop=(e)=>{const d=document.createElement('div');d.className='pop';d.textContent=e;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)};
const beep=(f,t)=>{try{const c=new (window.AudioContext||webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.type=t;o.connect(g);g.connect(c.destination);g.gain.value=.2;o.start();o.stop(c.currentTime+.25)}catch(e){}};
const yay=()=>{[523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,'sine'),i*120));pop('⭐')};const oops=()=>{beep(150,'sawtooth');pop('❌')};
function home(){M.innerHTML=`<div class="card" style="text-align:center"><h2>Mohtaref • محترف</h2><p>Lesson 2 – Information Security | الدرس الثاني – أمن المعلومات</p><input id="nm" placeholder="الاسم / Name" value="${name}"><button onclick="lesson()">📘 ابدأ الدرس / Start the Lesson</button><button class="g" onclick="exam('ar')">📝 اختبار عربي (الكل)</button><button class="g" onclick="exam('en')">📝 English Exam (All)</button></div>`}
function gn(){name=$('nm').value.trim();if(!name){$('nm').style.borderColor='red';$('nm').focus();return false}return true}
function lesson(){if(!gn())return;sec(0)}
function sec(i){if(i>2){M.innerHTML=`<div class="card" style="text-align:center"><h2>🌟 أنهيت الدرس! / Lesson finished!</h2><button class="g" onclick="exam('ar')">📝 ابدأ الاختبار (بالعربي)</button><button class="g" onclick="exam('en')">📝 Take the Exam (English)</button><button onclick="home()">⌂</button></div>`;return}
M.innerHTML=`<div class="bar"><i style="width:${(i+1)*33}%"></i></div><div class="g2"><div class="card" dir="ltr">${T.en.S[i][0]}</div><div class="card" dir="rtl">${T.ar.S[i][0]}</div></div><div class="card" style="text-align:center"><button onclick="quiz(${i},'ar')">❓ اختبر نفسك (بالعربي)</button><button onclick="quiz(${i},'en')">❓ Quick Quiz (English)</button><button class="g" onclick="sec(${i+1})">التالي / Next ▶</button></div>`}
function quiz(i,l){lang=l;run(T[l].S[i][1],false,()=>sec(i))}
function exam(l){if(!gn())return;lang=l;run(B[l].map((_,k)=>k),true,null)}
function run(ids,isEx,done){const t=T[lang],bank=B[lang];let k=0,sc=0,wr=[];
function show(){if(k>=ids.length){if(isEx)return fin();M.innerHTML=`<div class="card" dir="${t.d}"><h2>${t.sc}: ${sc}/${ids.length}</h2><button onclick="_d()">${t.nx}</button></div>`;window._d=done;return}
const q=bank[ids[k]];M.innerHTML=`<div class="card" dir="${t.d}"><div class="bar"><i style="width:${k/ids.length*100}%"></i></div><p>${k+1}/${ids.length}</p><h3>${q.q}</h3>${q.o.map((o,j)=>`<button class="o" data-j="${j}">${o}</button>`).join('')}</div>`;
M.querySelectorAll('.o').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;M.querySelectorAll('.o').forEach(x=>x.disabled=true);M.querySelectorAll('.o')[q.a].classList.add('good');if(j==q.a){sc++;yay()}else{b.classList.add('bad');oops();wr.push(ids[k]+1)}setTimeout(()=>{k++;show()},1100)})}
function fin(){const msg=`${name}\n${lang=='ar'?'اختبار الدرس الثاني - أمن المعلومات':'Lesson 2 Exam - Information Security'}\n${t.sc}: ${sc}/${ids.length}\n${lang=='ar'?'الأسئلة الخاطئة':'Wrong'}: ${wr.join(', ')||'-'}`;
M.innerHTML=`<div class="card" dir="${t.d}" style="text-align:center"><h2>${name}</h2><h2>${t.sc}: ${sc}/${ids.length}</h2><a href="https://wa.me/201099920517?text=${encodeURIComponent(msg)}" target="_blank"><button class="g">${t.send}</button></a><button onclick="home()">⌂</button></div>`;yay()}
if(done)T[lang].cb=done;show()}
home();
</script></body></html>
